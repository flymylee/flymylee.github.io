<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <link rel="stylesheet" href="/flymylee/assets/css/style.css?v=26d11cf5f20f5306d245873dc4c6e9fb07ba7ccf">

    <!-- 1. 메타 태그 방식 -->
    <meta http-equiv="refresh" content="0; url=/flymylee">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 2. 자바스크립트 방식 (보조) -->

      window.location.href = "/flymylee";

  </head>
  <body>
    <!-- 3. 만약의 경우를 대비한 수동 링크 -->

  </body>
</html>
